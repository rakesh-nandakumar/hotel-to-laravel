name: Deploy to Dev (dev host)

# Mirrors leolanka-filament's deploy-demo.yml, adapted for this repo:
#  - monorepo layout: Laravel API in backend/, React SPA in web/
#  - the artifact is built with `php artisan release:build`, which produces
#    ONE single-domain zip (SPA + Laravel core in app_core/ + .htaccess).
#    Extract it into the dev domain's document root and it just works.
#  - the zip is uploaded over FTP and extracted on the server with a
#    self-deleting unzip.php, exactly like the reference projects.

on:
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hotel-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy (Dev)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: development

    env:
      # TODO: replace with your dev host (e.g. test.htl.vellixglobal.com).
      # This host is baked into the release (.env + .htaccess 301 rules), so
      # keep it in sync with the cPanel domain the FTP account below lands in.
      DEV_HOST: "test.htl.vellixglobal.com"
      APP_URL: "https://test.htl.vellixglobal.com"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, bcmath, ctype, fileinfo, mysql, gd, zip, intl, exif, pcntl, dom, curl, xml
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Cache Composer dependencies (backend)
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-hotel-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            composer-hotel-

      - name: Install PHP dependencies (so artisan can run)
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend assets
        working-directory: web
        env:
          VITE_API_URL: ""
        run: npm run build

      - name: Prepare dev deploy env file
        # release:build bakes this file in as app_core/.env and validates it
        # (https APP_URL, matching TENANCY_BASE_DOMAIN, SANCTUM host, ...).
        # It is generated in CI only — never committed.
        run: |
          cp backend/.env.production backend/.env.staging
          sed -i "s/htl\.vellixglobal\.com/${DEV_HOST}/g" backend/.env.staging
          # TODO: replace with the DEV database credentials.
          sed -i "s/^DB_DATABASE=.*/DB_DATABASE=REPLACE_ME/" backend/.env.staging
          sed -i "s/^DB_USERNAME=.*/DB_USERNAME=REPLACE_ME/" backend/.env.staging
          sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=REPLACE_ME/" backend/.env.staging
          grep -E "^(APP_URL|TENANCY_BASE_DOMAIN|FRONTEND_URL|SANCTUM_STATEFUL_DOMAINS|DB_DATABASE|DB_USERNAME)=" backend/.env.staging

      - name: Build single-domain release zip
        working-directory: backend
        run: php artisan release:build --env-file=.env.staging --name=hotel-dev --skip-npm --no-interaction

      - name: Collect release zip
        run: |
          zip_file=$(ls -t backend/storage/app/release/hotel-dev-*.zip | head -n 1)
          echo "Release zip: $zip_file"
          cp "$zip_file" deploy.zip

      - name: Install zip and lftp
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends zip lftp

      - name: Create remote extractor script
        # The release zip's entries land DIRECTLY in the document root
        # (index.php, index.html, assets/, app_core/), so unlike the reference
        # projects this extractor targets its own directory, not one level up.
        run: |
          cat << 'EOF' > unzip.php
          <?php
          // This script lives in the document root next to deploy.zip.
          $baseDir = __DIR__;
          $zipFile = $baseDir . '/deploy.zip';

          if (!file_exists($zipFile)) {
              http_response_code(404);
              echo "Zip file not found at: " . $zipFile;
              exit;
          }

          $zip = new ZipArchive;
          if ($zip->open($zipFile) !== TRUE) {
              http_response_code(500);
              echo "Failed to open zip archive.";
              exit;
          }

          $success = $zip->extractTo($baseDir);
          $zip->close();
          @unlink($zipFile);

          if (!$success) {
              http_response_code(500);
              echo "Extraction failed. Check cPanel directory permissions.";
              exit;
          }

          // Clear Laravel caches inside the web-denied core folder.
          $cachePaths = [
              $baseDir . '/app_core/storage/framework/views/*.php',
              $baseDir . '/app_core/bootstrap/cache/*.php',
              $baseDir . '/app_core/storage/framework/cache/data/*/*',
          ];
          foreach ($cachePaths as $path) {
              foreach (glob($path) ?: [] as $file) {
                  if (is_file($file)) @unlink($file);
              }
          }

          if (function_exists('opcache_reset')) {
              opcache_reset();
          }

          @unlink(__FILE__);
          echo "Extraction and cache clear successful!";
          EOF

      - name: Upload build to cPanel (Dev)
        env:
          FTP_SERVER: "business196.web-hosting.com"
          FTP_USERNAME: "tesh_hms@demo.hms.vellixglobal.com"
          FTP_PASSWORD: "mEU3+1@$jINc3GOd"
        run: |
          if [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ] || [ "$FTP_USERNAME" = "REPLACE_ME" ]; then
            echo "::error::Missing FTP credentials — fill in FTP_SERVER/FTP_USERNAME/FTP_PASSWORD in deploy-dev.yml"
            exit 1
          fi

          if ! getent hosts "$FTP_SERVER" > /dev/null; then
            echo "::error::FTP server '$FTP_SERVER' could not be resolved."
            exit 1
          fi

          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:passive-mode true;
            set net:timeout 30;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;

            open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\";

            put deploy.zip;
            put unzip.php -o unzip.php;
          "

      - name: Trigger remote extraction
        run: |
          echo "Triggering remote extraction and cache clear..."
          response=$(curl -fsSL --retry 3 --retry-delay 5 --max-time 120 "${APP_URL}/unzip.php")
          echo "$response"

          if ! echo "$response" | grep -q "successful"; then
            echo "::error::Remote extraction did not report success."
            exit 1
          fi

          echo "Extraction on Dev complete!"

      - name: Apply pending migrations
        # First deploy ever still needs the MySQL dump imported via phpMyAdmin;
        # after that, /migrate applies each release's schema changes (no terminal).
        run: |
          echo "Applying pending migrations..."
          migrate_out=$(curl -fsSL --retry 3 --retry-delay 5 --max-time 300 "${APP_URL}/migrate")
          echo "$migrate_out"

          if echo "$migrate_out" | grep -qi "FAILED"; then
            echo "::error::Remote migrate reported FAILED — see output above."
            exit 1
          fi

          echo "Deployment to Dev complete!"
