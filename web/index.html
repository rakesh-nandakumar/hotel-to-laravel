<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#115542" />
    <!--
      Tenant branding (logo/name) is dynamic per-tenant (see BrandLogo.tsx) and
      isn't known at this static HTML level, so this is a neutral placeholder —
      its only job is to stop the browser's automatic /favicon.ico probe from
      404ing (that 404 was failing every e2e navigation/console-error check).
    -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23115542'/%3E%3Ctext x='16' y='22' font-family='Arial, sans-serif' font-size='16' font-weight='700' fill='white' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E" />
    <title>Hotel Management System</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Offline shell cache for POS resilience (see public/sw.js)
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js"));
      }
    </script>
  </body>
</html>
