# A page-load without a Host header is a bare probe of the shared server —
# drop it outright rather than let it reach anything.
map $http_host $has_host_header {
    default 1;
    ""      0;
}

server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  if ($has_host_header = 0) {
    return 444;
  }

  # The old host gate (auth_request /_host_check) is gone: path-prefix tenancy
  # serves every tenant under ONE host, so no request needs to be let through
  # by its Host anymore. main.tsx still calls /api/host-context at boot and
  # renders the plain unavailable page if the backend says this path owns
  # nothing — the SPA's own boot gate replaces the nginx-level one.

  # Laravel API — same-origin so Sanctum's SPA cookie session + CSRF cookie
  # need no CORS/cross-site handling.
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location /sanctum/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  # Reverb (realtime) — the browser connects directly per VITE_REVERB_* env
  # vars; this app/service is exposed on its own port, not proxied here.

  # Everything else: static files, then the SPA fallback — /{slug}/… and
  # /admin/… both serve the bundle and client-side routing takes over.
  location / {
    try_files $uri $uri/ /index.html;
  }
}

# ── Cutover (transitional) ───────────────────────────────────────────────────
# While the old subdomain style is still alive, forward every {slug}.{base}
# page load to the new prefix so printed QR codes and bookmarks keep working.
# The API/asset paths must NOT be rewritten — the old SPA build still talks to
# {slug}.{base}/api/... and the Phase-1 host fallback resolves those.
