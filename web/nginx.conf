# A page-load without a Host header is a bare probe of the shared server —
# drop it outright rather than let it reach anything.
map $http_host $has_host_header {
    default 1;
    ""      0;
}

server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  if ($has_host_header = 0) {
    return 444;
  }

  # Host gate (internal): resolves this request's Host header exactly like the
  # API's IdentifyTenant (via /api/host-context). A host that owns no tenant
  # and isn't the central panel gets the plain unavailable page instead of the
  # app bundle — the SPA never even downloads on hosts that can't use it.
  location = /_host_check {
    internal;
    proxy_pass http://api:8000/api/host-context;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
  }

  # Laravel API — same-origin so Sanctum's SPA cookie session + CSRF cookie
  # need no CORS/cross-site handling.
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location /sanctum/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  # Reverb (realtime) — the browser connects directly per VITE_REVERB_* env
  # vars; this app/service is exposed on its own port, not proxied here.

  # Everything else: static files, then the SPA fallback — every page load
  # passes the host gate first.
  location / {
    auth_request /_host_check;
    error_page 401 403 404 = @unavailable;
    try_files $uri $uri/ /index.html;
  }

  location @unavailable {
    default_type text/html;
    try_files /unavailable.html =404;
  }
}
